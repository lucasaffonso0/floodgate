syntax = "proto3";
package observer;
option go_package = "github.com/cilium/cilium/api/v1/observer";

import "flow/flow.proto";
import "google/protobuf/timestamp.proto";

service Observer {
  rpc GetFlows(GetFlowsRequest) returns (stream GetFlowsResponse);
  rpc ServerStatus(ServerStatusRequest) returns (ServerStatusResponse);
}

message GetFlowsRequest {
  uint64 number = 1;
  bool follow = 3;
  // Fields 5 and 6 confirmed live against a real Hubble Relay (kind-pop-os,
  // 2026-10-15/16): a whitelist of verdict DROPPED returned only DROPPED
  // flows, and a blacklist of reply [true] returned no replies while keeping
  // flows whose is_reply is unknown. Field 4 is NOT the whitelist: tried
  // first, the relay silently ignored it and streamed everything.
  repeated flow.FlowFilter blacklist = 5;
  repeated flow.FlowFilter whitelist = 6;
  google.protobuf.Timestamp since = 7;
  google.protobuf.Timestamp until = 8;
}

// Field numbers match Hubble v1.15+ (relay adds node_status=2, lost_events=3;
// time and node_name moved to 1001/1000 to avoid collision with the oneof).
message GetFlowsResponse {
  oneof response_types {
    flow.Flow flow = 1;
    bytes node_status = 2;   // relay.NodeStatusEvent — parsed as raw bytes, ignored
    bytes lost_events = 3;   // flow.LostEvent — parsed as raw bytes, ignored
  }
  string node_name = 1000;
  google.protobuf.Timestamp time = 1001;
}

message ServerStatusRequest {}

message ServerStatusResponse {
  uint64 num_flows = 1;
  uint64 max_flows = 2;
  uint64 seen_flows = 3;
  uint64 uptime_ns = 4;
  string version = 8;
}
