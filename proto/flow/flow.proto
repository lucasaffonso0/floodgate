syntax = "proto3";
package flow;
option go_package = "github.com/cilium/cilium/api/v1/flow";

import "google/protobuf/timestamp.proto";

enum Verdict {
  VERDICT_UNKNOWN = 0;
  FORWARDED = 1;
  DROPPED = 2;
  ERROR = 3;
  AUDIT = 4;
}

message Flow {
  google.protobuf.Timestamp time = 1;
  Verdict verdict = 2;
  IP ip = 5;
  Endpoint source = 8;
  Endpoint destination = 9;
  Layer4 l4 = 6;
}

// Field number 5 confirmed live against a real cluster (kind-pop-os,
// 2026-09-22): curled 1.1.1.1 from a test pod and the decoded
// ip.destination came back exactly "1.1.1.1". destination_names (DNS
// names, only populated when Cilium DNS-visibility is enabled) was NOT
// added here — this cluster doesn't have DNS-visibility on, so there was
// no live data to verify its field number against, and guessing wrong
// risks corrupting the whole flow stream (field 10 threw a hard decode
// error during this same verification pass) rather than just missing a
// bonus feature. Add it once there's a cluster with DNS-visibility on to
// verify against, the same way this field was.
message IP {
  string source = 1;
  string destination = 2;
}

message Endpoint {
  uint32 ID = 1;
  uint32 identity = 2;
  string namespace = 3;
  repeated string labels = 4;
  string pod_name = 5;
  repeated Workload workloads = 6;
}

message Workload {
  string name = 1;
  string kind = 2;
}

message Layer4 {
  oneof protocol {
    TCP TCP = 1;
    UDP UDP = 2;
  }
}

message TCP {
  uint32 source_port = 1;
  uint32 destination_port = 2;
}

message UDP {
  uint32 source_port = 1;
  uint32 destination_port = 2;
}
