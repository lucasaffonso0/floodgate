---
# ecommerce/recommendation-engine: producao simulada (porta 8080) -> product-catalog.ecommerce, inventory-db.data
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-engine
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-engine
  template:
    metadata:
      labels:
        app: recommendation-engine
    spec:
      containers:
      - name: recommendation-engine
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /www && printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nrecommendation-engine\n' > /www/index.html
          busybox httpd -f -p 8080 -h /www &
          while true; do
            wget -qT3 -O/dev/null http://product-catalog.ecommerce.svc.cluster.local:8080 2>/dev/null
            sleep 9
            wget -qT3 -O/dev/null http://inventory-db.data.svc.cluster.local:8080 2>/dev/null
            sleep 9
          done
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-engine
  namespace: ecommerce
spec:
  selector:
    app: recommendation-engine
  ports:
  - port: 8080
    targetPort: 8080
---
