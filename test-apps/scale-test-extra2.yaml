# search/search-indexer: producao simulada (porta 8080) -> product-catalog.ecommerce
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  namespace: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-indexer
  template:
    metadata:
      labels:
        app: search-indexer
    spec:
      containers:
      - name: search-indexer
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /www && printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nsearch-indexer\n' > /www/index.html
          busybox httpd -f -p 8080 -h /www &
          while true; do
            wget -qT3 -O/dev/null http://product-catalog.ecommerce.svc.cluster.local:8080 2>/dev/null
            sleep 9
          done
        ports:
        - containerPort: 8080
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {cpu: 50m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: search-indexer
  namespace: search
spec:
  selector: {app: search-indexer}
  ports: [{port: 8080, targetPort: 8080}]
