# ecommerce/storefront: producao simulada (porta 8080) -> product-catalog.ecommerce, cart-service.ecommerce, api-gateway.platform
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
      - name: storefront
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /www && printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nstorefront\n' > /www/index.html
          busybox httpd -f -p 8080 -h /www &
          while true; do
            wget -qT3 -O/dev/null http://product-catalog.ecommerce.svc.cluster.local:8080 2>/dev/null
            sleep 9
            wget -qT3 -O/dev/null http://cart-service.ecommerce.svc.cluster.local:8080 2>/dev/null
            sleep 9
            wget -qT3 -O/dev/null http://api-gateway.platform.svc.cluster.local:8080 2>/dev/null
            sleep 9
          done
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ecommerce
spec:
  selector:
    app: storefront
  ports:
  - port: 8080
    targetPort: 8080
---
