# platform/api-gateway: producao simulada (porta 8080) -> auth-service.identity, rate-limiter.platform
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /www && printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\napi-gateway\n' > /www/index.html
          busybox httpd -f -p 8080 -h /www &
          while true; do
            wget -qT3 -O/dev/null http://auth-service.identity.svc.cluster.local:8080 2>/dev/null
            sleep 9
            wget -qT3 -O/dev/null http://rate-limiter.platform.svc.cluster.local:8080 2>/dev/null
            sleep 9
          done
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: platform
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
---
# platform/rate-limiter: producao simulada (porta 8080) -> (sem chamadas de saída)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rate-limiter
  template:
    metadata:
      labels:
        app: rate-limiter
    spec:
      containers:
      - name: rate-limiter
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /www && printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\n\r\nrate-limiter\n' > /www/index.html
          busybox httpd -f -p 8080 -h /www &
          while true; do
            sleep 30
          done
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
  namespace: platform
spec:
  selector:
    app: rate-limiter
  ports:
  - port: 8080
    targetPort: 8080
