apiVersion: v1
kind: Namespace
metadata:
  name: database
---
# Simulated database service (nginx on port 80, exposed as port 5432)
# Floodgate resolves targetPort=80 for policy creation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: database
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 80
---
# Second service in same namespace to test intra-namespace policies
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-replica
  namespace: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-replica
  template:
    metadata:
      labels:
        app: db-replica
    spec:
      containers:
        - name: db-replica
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db-replica
  namespace: database
spec:
  selector:
    app: db-replica
  ports:
    - port: 5432
      targetPort: 80
