# Full name of the release to be used in the chart. If set, overrides the default name generated by Helm.
fullnameOverride: floodgate

# Number of replicas for the deployment. Ignored if autoscaling is enabled.
replicaCount: 1

image:
  # Container image repository
  repository: floodgate
  # Image pull policy: Always, IfNotPresent, Never
  pullPolicy: IfNotPresent
  # Image tag. If not set, uses .Chart.AppVersion
  tag: latest

livenessProbe:
  # Enable or disable the livenessProbe
  enabled: true
  # HTTP probe configuration
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30

readinessProbe:
  # Enable or disable the readinessProbe
  enabled: true
  # HTTP probe configuration
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

service:
  # Kubernetes service type: ClusterIP, NodePort, LoadBalancer
  type: ClusterIP   # NodePort para kind: type: NodePort, nodePort: 30800
  # Port exposed externally
  port: 3000
  # Port the container is listening on
  containerPort: 3000

clusterIssuer:
  # Enable ClusterIssuer creation
  enabled: false
  # ClusterIssuer name
  name: letsencrypt-prod
  # Email used for Let's Encrypt registration
  email: example@gmail.com
  # ACME production endpoint
  server: https://acme-v02.api.letsencrypt.org/directory
  gateway:
    # Gateway name used for validation
    name: shared-gateway
    # Gateway namespace
    namespace: nginx-gateway

gateway:
  # Enable Gateway creation (disable in other releases)
  enabled: false
  # GatewayClass to use
  gatewayClassName: nginx
  ### ClusterIssuer for automatic TLS
  #clusterIssuer: letsencrypt-prod
  # Gateway name (shared resource)
  name: shared-gateway
  # Gateway namespace
  namespace: nginx-gateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP

    - name: https
      hostname: "example.com.br"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          # Allow routes from all namespaces
          from: All
      tls:
        # TLS terminates at the Gateway
        mode: Terminate
        certificateRefs:
            # Reference kind
          - kind: Secret
            # TLS secret name
            name: example-tls

httproute:
  # Enable HTTPRoute creation
  enabled: false
  gateway:
      # Gateway name
    - name: shared-gateway
      # Gateway namespace
      namespace: nginx-gateway
      # HTTPS listener section
      sectionName: https
  # Hostname handled by this route
  hostnames:
    - example.com.br

ingress:
  # Enable Ingress creation
  enabled: false
  # IngressClass name: nginx, traefik, alb, etc.
  className: nginx
  # Hostnames handled by this Ingress
  hostnames:
    - example.com.br
  # Path prefix
  path: /
  # Path type: Prefix, Exact, ImplementationSpecific
  pathType: Prefix
  # Extra annotations (merged with the nginx class annotation)
  annotations: {}
  tls:
    # Enable TLS via cert-manager
    enabled: false
    # ClusterIssuer name
    clusterIssuer: letsencrypt-prod

autoscaling:
  # Enable or disable the HorizontalPodAutoscaler
  enabled: false
  # Minimum number of replicas
  minReplicas: 1
  # Maximum number of replicas
  maxReplicas: 3
  # CPU utilization percentage that triggers autoscaling
  targetCPUUtilizationPercentage: 80

# Schedule pods on specific nodes
nodeSelector: {}
# Tolerations for node taints
tolerations: []
# Pod affinity rules
affinity: {}

# Extra annotations for pods
podAnnotations: {}
# Extra labels for pods
podLabels: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Container resource requests and limits
resources:
  enabled: true
  requests:
    cpu: "100m"        # 100 millicores = 0.1 CPU
    memory: "128Mi"    # 128 MB memory
  limits:
    cpu: "500m"        # Maximum 0.5 CPU
    memory: "256Mi"    # Maximum 256 MB

# ConfigMap to be injected via envFrom
# DB_PATH is non-sensitive and safe to commit
configmap:
  enabled: true
  configMapName: floodgate-config
  data:
    DB_PATH: /data/floodgate.db
    # Dois valores possíveis, nenhum outro é válido:
    #   direct = floodgate escreve a NetworkPolicy direto na API do K8s.
    #   gitops = floodgate só faz commit num repo git; quem aplica de
    #            verdade no cluster é o ArgoCD (ou outro operador GitOps)
    #            observando esse repo. Sem esse operador rodando, nada é
    #            aplicado de verdade, mesmo que o floodgate mostre sucesso.
    # Também controla o RBAC (rbac.yaml): gitops tira os verbos de escrita
    # de networkpolicies do ClusterRole sozinho.
    WRITE_MODE: gitops

# Secret to be injected via envFrom
# JWT_SECRET must be created manually before deploy:
#   kubectl create secret generic floodgate-secrets \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 32) -n floodgate
secret:
  enabled: true  # Enable secret usage
  create: false  # If true, creates the secret with the data below
  secretName: "floodgate-secrets"   # Secret name (for creation or reference)
  data: {}

serviceAccount:
  create: true
  name: floodgate
  automount: true
  annotations: {}

rbac:
  # Enable ClusterRole + ClusterRoleBinding creation
  enabled: true
  # Rules granted to the ServiceAccount
  rules:
    - apiGroups: [""]
      # pods: needed to resolve named targetPorts (containerPort lookup) and
      # as the last-resort tier of resolvePodSelector (src.ts/k8s.ts)
      resources: ["services", "namespaces", "endpoints", "pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      # Fallback tiers of resolvePodSelector (src/lib/k8s.ts): a source
      # workload with no Service (e.g. a queue worker that only ever makes
      # outbound connections) is looked up here instead, by exact name.
      # "get" only, no "list"/"watch" needed.
      resources: ["deployments", "statefulsets", "daemonsets"]
      verbs: ["get"]
    # networkpolicies write verbs are NOT here. templates/rbac.yaml grants
    # them in a separate, dedicated block, gated by configmap.data.WRITE_MODE
    # (the same value that decides the app's own write path) instead of a
    # second flag that could drift out of sync with it. WRITE_MODE: gitops
    # means this ClusterRole never gets create/update/patch/delete on
    # networkpolicies, full stop: an infrastructure guarantee, not just an
    # app-level check.

# PersistentVolumeClaim for SQLite database
pvc:
  enabled: true
  name: floodgate-data
  size: 2Gi
  accessMode: ReadWriteOnce
  storageClass: ""   # "" = cluster default

# List of additional volumes to be mounted into the Pod
volumes:
  - name: data
    persistentVolumeClaim:
      claimName: floodgate-data

# List of additional volume mounts for the container
volumeMounts:
  - name: data
    mountPath: /data

# Remote secrets configuration (e.g., AWS Secrets Manager)
secretsremote:
  # Enables remote secrets integration
  enabled: false
  # List of secrets to be consumed
  secrets: []
